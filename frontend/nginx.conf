server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://alumni-api:8080;
        proxy_set_header Host $host;
    }

    location = /hello {
        proxy_pass http://alumni-api:8080/api/v1/hello;
        proxy_set_header Host $host;
    }

    location /hello/ {
        proxy_pass http://alumni-api:8080/api/v1/hello/;
        proxy_set_header Host $host;
    }

    location /sum/ {
        proxy_pass http://alumni-api:8080/api/v1/sum/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
