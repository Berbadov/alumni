[package]
name = "alumni-frontend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
console_error_panic_hook = "0.1"
gloo-net = { version = "0.7", features = ["http", "json"] }
leptos = { version = "0.8.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "DomTokenList",
    "Element",
    "History",
    "Location",
    "Storage",
    "Window",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
